name: grubify
metadata:
  template: grubify-food-delivery@0.0.1-beta

services:
  api:
    project: ./GrubifyApi
    language: docker
    host: containerapp
    docker:
      path: ./Dockerfile
      remoteBuild: true

  frontend:
    project: ./grubify-frontend
    language: docker
    host: containerapp
    docker:
      path: ./Dockerfile
      remoteBuild: true

hooks:
  postdeploy:
    posix:
      shell: sh
      run: |
        echo "🍕 Grubify Food Delivery App deployed successfully!"
        echo "Frontend URL: $FRONTEND_URL"
        echo "API URL: $API_BASE_URL"
    windows:
      shell: pwsh
      run: |
        echo "🍕 Grubify Food Delivery App deployed successfully!"
        echo "Frontend URL: $env:FRONTEND_URL"
        echo "API URL: $env:API_BASE_URL"
